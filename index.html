<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरा खाता — दुकान खाता</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi:ital@0;1&family=Mukta:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f2f5; --paper2:#e8eaee; --surface:#ffffff; --surface2:#f6f7f9;
  --ink:#15171c; --ink2:#3f434c; --dim:#787d88; --line:rgba(18,20,26,.10); --line2:rgba(18,20,26,.055);
  --terra:#c2410c; --terra2:#ea580c; --terra-dim:#ffedd5; --terra-ink:#7c2d12;
  --green:#15803d; --green-dim:#dcfce7; --green-ink:#14532d;
  --red:#dc2626; --red-dim:#fee2e2; --red-ink:#7f1d1d;
  --gold:#b45309; --gold-dim:#fef3c7;
  --blue:#0f6ea8; --blue-dim:#dff0f9;
  --shadow:0 1px 2px rgba(18,20,26,.05),0 6px 18px -10px rgba(18,20,26,.18);
  --shadow-lg:0 2px 6px rgba(18,20,26,.06),0 22px 44px -22px rgba(18,20,26,.28);
  --r:16px; --r-sm:11px;
  --f-head:"Tiro Devanagari Hindi",Georgia,serif;
  --f-body:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#191613; --paper2:#141110; --surface:#221e1a; --surface2:#2a251f;
    --ink:#f0e9dd; --ink2:#d6cbb9; --dim:#9c8f7c; --line:rgba(240,233,221,.14); --line2:rgba(240,233,221,.07);
    --terra:#e08c4b; --terra2:#f0a868; --terra-dim:#3a2a1a; --terra-ink:#f6c9a0;
    --green:#6cc48a; --green-dim:#1c3324; --green-ink:#a7e0bb;
    --red:#f08a84; --red-dim:#3a1f1d; --red-ink:#f6b6b2;
    --gold:#d6a94a; --gold-dim:#332a14;
    --blue:#7fb0dd; --blue-dim:#16283a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--f-body); color:var(--ink); background:var(--paper);
  background-image:
    radial-gradient(1200px 600px at 100% -10%,rgba(180,83,9,.08),transparent 60%),
    radial-gradient(900px 500px at -10% 110%,rgba(30,79,122,.07),transparent 60%);
  background-attachment:fixed;
  font-size:16px; line-height:1.5; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:400;line-height:1.2;letter-spacing:.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--terra)}
::selection{background:var(--terra-dim)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:11px 20px;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{
  width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--terra),var(--terra2));color:#fff;
  font-family:var(--f-head);font-size:22px;box-shadow:var(--shadow);
}
.brand .nm{font-family:var(--f-head);font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.topbar .spacer{flex:1}
.rolechip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.rolechip .dot{width:8px;height:8px;border-radius:50%;background:var(--terra)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--terra);color:var(--terra)}
.btn.primary{background:linear-gradient(150deg,var(--terra),var(--terra2));border-color:transparent;color:#fff;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.06);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:8px}
.btn.block{width:100%;justify-content:center}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 22px;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{padding:10px 16px;border-radius:10px 10px 0 0;color:var(--dim);font-weight:500;border-bottom:2.5px solid transparent;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--terra);border-bottom-color:var(--terra);background:color-mix(in srgb,var(--terra) 7%,transparent)}
.panel{animation:fadeUp .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media(max-width:820px){.g-2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--terra) 9%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--terra) 26%,var(--line));box-shadow:var(--shadow-lg)}
.card.recessed{background:var(--surface2);box-shadow:none}
.card h3{font-size:17px;margin-bottom:2px}
.card .hint{font-size:13px;color:var(--dim);margin-bottom:14px}
.sec-label{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.sec-label .d{width:7px;height:7px;border-radius:2px;background:var(--terra)}

.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi .k-lbl{font-size:12.5px;color:var(--dim);letter-spacing:.03em}
.kpi .k-val{font-family:var(--f-head);font-size:31px;margin-top:8px;line-height:1}
.kpi .k-sub{font-size:12.5px;color:var(--dim);margin-top:7px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.red{background:var(--red-dim);color:var(--red-ink)}
.pill.green{background:var(--green-dim);color:var(--green-ink)}
.pill.amber{background:var(--gold-dim);color:var(--gold)}
.pill.blue{background:var(--blue-dim);color:var(--blue)}

/* ---------- table ---------- */
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
thead th{
  text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);font-weight:500;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);
  position:sticky;top:0;white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--terra) 5%,transparent)}
tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.amt-in{color:var(--red);font-weight:600}
.amt-out{color:var(--green);font-weight:600}
.cust-name{font-weight:600}
.cust-sub{font-size:12.5px;color:var(--dim)}

.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-size:13.5px;color:var(--dim)}
.pager .pages{display:flex;gap:6px;flex-wrap:wrap}
.pager button{padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px}
.pager button.on{background:var(--terra);color:#fff;border-color:transparent}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:.02em}
.field input,.field select,.field textarea{
  padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);transition:.15s;width:100%;
}
.field textarea{resize:vertical;min-height:86px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--terra);box-shadow:0 0 0 3px color-mix(in srgb,var(--terra) 16%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{padding:9px 16px;font-weight:600;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--terra);color:#fff}
.seg button.on.pay{background:var(--green)}
.seg button.on.due{background:var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2)}
.switch:last-of-type{border-bottom:none}
.switch .t{font-weight:600}
.switch .d{font-size:12.5px;color:var(--dim)}
.toggle{width:48px;height:27px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:23px}

/* ---------- login ---------- */
.login-wrap{max-width:940px;margin:5vh auto 0;padding:0 20px}
.login-hero{text-align:center;margin-bottom:30px}
.login-hero h1{font-size:clamp(30px,5vw,46px);margin-bottom:10px}
.login-hero p{color:var(--dim);max-width:560px;margin:0 auto;font-size:15.5px}
.login-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.login-cards.single{grid-template-columns:1fr;max-width:540px;margin:0 auto}
@media(max-width:720px){.login-cards{grid-template-columns:1fr}}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow-lg)}
.lc .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;font-family:var(--f-head);font-size:24px}
.lc.cust .ic{background:var(--blue-dim);color:var(--blue)}
.lc.admin .ic{background:var(--terra-dim);color:var(--terra-ink)}
.lc h3{font-size:21px;margin-bottom:5px}
.lc .p{font-size:13.5px;color:var(--dim);margin-bottom:18px}
.note{font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.5}
.err{font-size:13px;color:var(--red);margin-top:10px;min-height:18px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.5);backdrop-filter:blur(3px);z-index:60;display:none}
.scrim.on{display:block;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--paper);z-index:70;
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;background:var(--surface)}
.drawer-body{padding:20px 22px 40px;overflow-y:auto}
.drawer-body h4{font-family:var(--f-head);font-size:16px;margin:22px 0 10px}
.drawer-body h4:first-child{margin-top:0}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);max-width:520px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;animation:fadeUp .3s both}

/* ---------- misc ---------- */
.bar{height:11px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line2)}
.bar>i{display:block;height:100%;border-radius:999px}
.age-row{display:grid;grid-template-columns:110px 1fr 130px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.age-row:last-child{border-bottom:none}
@media(max-width:560px){.age-row{grid-template-columns:1fr;gap:4px}}
.callbox{background:linear-gradient(160deg,var(--blue-dim),var(--surface));border:1px solid color-mix(in srgb,var(--blue) 30%,var(--line));border-radius:var(--r);padding:18px}
.ledger-line{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.ledger-line .dt{font-family:var(--f-mono);font-size:12.5px;color:var(--dim);flex:none;width:88px}
.ledger-line .desc{flex:1;min-width:0}
.ledger-line .desc .n{font-weight:500}
.ledger-line .desc .s{font-size:12.5px;color:var(--dim)}
.ledger-line .amt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty .big{font-family:var(--f-head);font-size:20px;color:var(--ink);margin-bottom:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;font-size:14px;z-index:100;opacity:0;transition:.3s;box-shadow:var(--shadow-lg);max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.tag{display:inline-block;font-size:11px;font-family:var(--f-mono);padding:2px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--dim)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}


/* ================= APP SHELL ================= */
.appbar{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:12px;padding:11px 16px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.appbar .ttl{flex:1;min-width:0}
.appbar .ttl .t1{font-family:var(--f-head);font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl .t2{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(150deg,var(--terra),var(--terra2));color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.avatar.alt{background:linear-gradient(150deg,#0f6ea8,#0b4f7a)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);position:relative;flex:none;transition:.15s}
.iconbtn:hover{color:var(--terra);border-color:color-mix(in srgb,var(--terra) 40%,var(--line))}
.iconbtn svg{width:19px;height:19px}
.iconbtn .badge{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;text-align:center;transition:.15s;color:var(--ink);min-width:0}
.tile:active{transform:scale(.97)}
.tile .ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile .ti svg{width:22px;height:22px}
.tile span{line-height:1.2}
.ti-1{background:linear-gradient(150deg,#c2410c,#7c2d12)}
.ti-2{background:linear-gradient(150deg,#0f6ea8,#0b4f7a)}
.ti-3{background:linear-gradient(150deg,#15803d,#14532d)}
.ti-4{background:linear-gradient(150deg,#b45309,#78350f)}
.ti-5{background:linear-gradient(150deg,#be123c,#7f1d3d)}
.ti-6{background:linear-gradient(150deg,#0f766e,#134e4a)}
.adminnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;gap:2px;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px -14px rgba(0,0,0,.45)}
.adminnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:13px;color:var(--dim);font-size:10.5px;font-weight:600}
.adminnav button.on{color:var(--terra);background:color-mix(in srgb,var(--terra) 11%,transparent)}
.adminnav svg{width:22px;height:22px;stroke-width:1.9}
.morelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.moreitem{display:flex;align-items:center;gap:11px;padding:13px;border-radius:15px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-align:left}
.moreitem .ti{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.moreitem .ti svg{width:20px;height:20px}
.kpi .k-val{letter-spacing:-.01em}
.card{border-radius:var(--r)}
.statrow{display:flex;gap:10px;flex-wrap:wrap}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-head h3{margin:0}
.sec-head .lnk{font-size:13px;font-weight:600;color:var(--terra)}
@media(max-width:900px){
  .tabs{display:none!important}
  .adminnav{display:flex}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom));right:14px}
  .adminwrap{padding-bottom:104px!important}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
  .tile{padding:12px 4px 11px;font-size:12px;border-radius:16px}
  .tile .ti{width:40px;height:40px;border-radius:13px}
  .appbar{padding:9px 13px}
  .appbar .ttl .t1{font-size:16.5px}
}
@media(min-width:901px){ .adminnav{display:none!important} .tiles{grid-template-columns:repeat(6,minmax(0,1fr));max-width:900px} }


/* ---------- voice assistant ---------- */
.fab{position:fixed;right:18px;bottom:18px;z-index:55;width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,var(--terra),var(--terra2));color:#fff;display:grid;place-items:center;border:none;box-shadow:var(--shadow-lg);transition:.15s}
.fab:hover{transform:scale(1.05)}
.fab svg{width:27px;height:27px}
.asr-mic{width:92px;height:92px;border-radius:50%;background:linear-gradient(150deg,var(--terra),var(--terra2));color:#fff;display:inline-grid;place-items:center;border:none;box-shadow:var(--shadow-lg);transition:.2s}
.asr-mic svg{width:38px;height:38px}
.asr-mic.rec{background:linear-gradient(150deg,#dc2626,#991b1b);animation:recpulse 1.5s infinite}
@keyframes recpulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}70%{box-shadow:0 0 0 22px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.asheet .chips .chip{cursor:pointer}

/* ---------- customer app: bottom nav + shop ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:4px;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px -14px rgba(0,0,0,.5)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:13px;color:var(--dim);font-size:11.5px;font-weight:600;transition:.15s}
.bnav button.on{color:var(--terra);background:color-mix(in srgb,var(--terra) 11%,transparent)}
.bnav svg{width:22px;height:22px;stroke-width:1.9}
.custwrap{padding-bottom:104px!important}
.shop-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--terra),var(--terra2));color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left;transition:.15s;display:flex;flex-direction:column}
.pcard:hover{border-color:color-mix(in srgb,var(--terra) 45%,var(--line))}
.pcard:active{transform:scale(.98)}
.pcard .pi{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface2);display:block}
.pcard .pb{padding:9px 11px 12px;display:flex;flex-direction:column;flex:1}
.pcard .pn{font-weight:600;font-size:14.5px;line-height:1.25}
.pcard .pu{font-size:12px;color:var(--dim);margin-top:2px}
.pcard .pr{font-family:var(--f-mono);font-weight:700;font-size:16px;margin-top:auto;padding-top:7px;color:var(--terra)}
.pcard .os{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:700}
.thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--surface2);flex:none;border:1px solid var(--line)}
.thumb-lg{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:var(--surface2);border:1px solid var(--line);display:block}
.cust-hello{font-size:13.5px;color:var(--dim)}
.cust-hello b{color:var(--ink)}

/* ---------- banners / ads ---------- */
.bn-carousel{position:relative;margin-bottom:18px}
.bn-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.bn-track::-webkit-scrollbar{display:none}
.bn{position:relative;flex:0 0 100%;scroll-snap-align:center;border-radius:18px;overflow:hidden;min-height:172px;display:flex;align-items:flex-end;color:#fff;box-shadow:var(--shadow-lg)}
.bn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bn .bn-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.bn .bn-body{position:relative;padding:18px 20px;width:100%}
.bn .bn-t{font-family:var(--f-head);font-size:clamp(20px,4.6vw,27px);line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.bn .bn-s{font-size:14px;opacity:.95;margin-top:5px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.bn .bn-cta{display:inline-block;margin-top:12px;background:rgba(255,255,255,.95);color:#1c1917;font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:999px}
.bn-dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.bn-dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
.bn-dots i.on{background:var(--terra);width:20px;border-radius:999px}
.bn-thumb{width:112px;height:64px;border-radius:10px;flex:none;background-size:cover;background-position:center;border:1px solid var(--line)}
.colorpick{display:flex;gap:10px;align-items:center}
.colorpick input[type=color]{width:52px;height:38px;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.offer-card{border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.offer-card .oc-t{font-family:var(--f-head);font-size:19px}
.offer-card .oc-b{font-size:14px;opacity:.95;margin-top:5px;white-space:pre-wrap}
.offer-card .oc-d{font-size:12px;opacity:.8;margin-top:8px}
.toolbar .grow{flex:1;min-width:200px}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.footnote{font-size:12px;color:var(--dim);line-height:1.55;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
details.fold{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface2);margin-top:14px}
details.fold summary{cursor:pointer;font-weight:600;font-size:14px}
details.fold p{font-size:13.5px;color:var(--dim);margin-top:10px;line-height:1.6}
@media(max-width:600px){
  .topbar{padding:9px 12px;gap:8px}
  .brand .sub{display:none}
  .brand .mark{width:33px;height:33px;font-size:19px;border-radius:9px}
  .brand .nm{font-size:16px}
  .rolechip{font-size:11.5px;padding:5px 9px}
  .btn.sm{padding:6px 9px}
  .wrap{padding:16px 13px 70px}
  .card{padding:15px}
  .kpi .k-val{font-size:27px}
}

/* ---------- MOBILE: app-like layout ---------- */
@media(max-width:680px){
  body{font-size:15.5px}
  .wrap{padding:14px 12px 84px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;gap:2px;margin:2px 0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 13px;font-size:14.5px;white-space:nowrap;flex:none}
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-val{font-size:24px}
  .kpi .k-lbl{font-size:12px}
  .g-2,.g-3{grid-template-columns:1fr}
  .card{padding:15px;border-radius:13px}
  .sec-label{font-size:10.5px}
  h1{font-size:22px}
  .btn{padding:10px 14px}
  .btn.block{width:100%;justify-content:center}
  .toolbar{flex-direction:column;align-items:stretch;gap:9px}
  .toolbar .grow{width:100%}
  .toolbar .btn{width:100%;justify-content:center}
  .row2{grid-template-columns:1fr}
  .search input{padding:11px 12px 11px 36px}
  /* tables become cards */
  .tbl-wrap{border:none;background:transparent;border-radius:0}
  .tbl-scroll{overflow:visible}
  .tbl-scroll table{display:block;width:100%}
  .tbl-scroll thead{display:none}
  .tbl-scroll tbody{display:block}
  .tbl-scroll tr{display:block;border:1px solid var(--line);border-radius:13px;background:var(--surface);box-shadow:var(--shadow);padding:10px 13px;margin-bottom:10px}
  .tbl-scroll tr:hover{background:var(--surface)}
  .tbl-scroll td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:5px 0;border:none;text-align:right;font-size:15px}
  .tbl-scroll td::before{content:attr(data-label);flex:none;text-align:left;color:var(--dim);font-size:12.5px;font-weight:500}
  .tbl-scroll td[data-label=""]{display:block;text-align:left;padding:3px 0}
  .tbl-scroll td[data-label=""]::before{display:none}
  .tbl-scroll td[data-label=""]:first-child{font-size:16px;padding-top:2px}
  .pager{flex-direction:column;gap:8px;align-items:stretch}
  .pager .pages{justify-content:center}
  .drawer{width:100%}
  .drawer-body{padding:16px 15px 60px}
  .drawer-head{padding:15px 15px}
  .bn{min-height:150px}
  .bn .bn-body{padding:14px 16px}
  .slip-modal .slip-scroll{padding:10px}
  .slip-modal .slip-actions{padding:12px 14px}
  .slip-modal .slip-actions .btn{width:100%}
  .modal{align-items:flex-end;padding:0}
  .modal .box{max-width:100%;border-radius:20px 20px 0 0;max-height:94vh;overflow:auto}
  .login-wrap{margin-top:3vh}
  .login-hero h1{font-size:26px}
  .ledger-line{flex-wrap:wrap;gap:4px 10px}
  .ledger-line .dt{width:auto}
  .age-row{grid-template-columns:1fr auto;gap:6px 10px}
  .age-row .bar{grid-column:1/-1}
  .topbar{position:sticky}
  .sticky-save{position:sticky;bottom:0}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pcard .pb{padding:8px 10px 11px}
  .pcard .pn{font-size:14px}
  .bnav{padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{font-size:11px}
  .fab{right:14px;bottom:calc(82px + env(safe-area-inset-bottom));width:52px;height:52px}
  .fab svg{width:24px;height:24px}
  .asr-mic{width:80px;height:80px}
  .asr-mic svg{width:33px;height:33px}
  .item-row{grid-template-columns:1fr 52px 70px 30px !important;gap:5px !important}
  .item-row input{min-width:0;padding:9px 8px;font-size:14.5px}
  .colorpick input[type=color]{width:46px;height:36px}
  .bn-thumb{width:84px;height:52px}
}
.item-row input{min-width:0}
/* ---------- slips / printing ---------- */
.slip{background:#fff;color:#111;font-family:var(--f-mono);width:302px;max-width:100%;margin:0 auto;padding:12px 14px;font-size:12px;line-height:1.5;border-radius:6px}
.slip.wide{width:100%;max-width:780px;font-family:var(--f-body);font-size:13px}
.slip .s-shop{text-align:center;font-family:var(--f-head);font-size:19px;font-weight:600;letter-spacing:.02em}
.slip .s-meta{text-align:center;font-size:11px;color:#555;margin-top:2px}
.slip .s-kind{text-align:center;font-weight:600;margin:8px 0;padding:4px 0;border-top:1px dashed #999;border-bottom:1px dashed #999;letter-spacing:.06em}
.slip .s-row{display:flex;justify-content:space-between;gap:8px;padding:1.5px 0}
.slip .s-row.b{font-weight:700}
.slip hr{border:none;border-top:1px dashed #999;margin:8px 0}
.slip table{width:100%;border-collapse:collapse;font-size:11.5px}
.slip.wide table{font-size:12.5px}
.slip th{text-align:left;border-bottom:1px solid #333;padding:3px 2px;font-weight:600}
.slip td{padding:2px;vertical-align:top}
.slip .r{text-align:right}.slip .c{text-align:center}
.slip .s-foot{text-align:center;font-size:10.5px;color:#555;margin-top:10px;line-height:1.5}
.slip .cust-block{margin:6px 0;padding:6px 0;border-top:1px dashed #999}
.slip-modal .slip-scroll{max-height:62vh;overflow:auto;padding:18px;background:var(--surface2)}
.slip-modal .slip-actions{display:flex;gap:10px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
#printRoot{display:none}
@media print{
  html,body{background:#fff!important;background-image:none!important}
  body>*{display:none!important}
  #printRoot{display:block!important}
  #printRoot .slip{width:auto;max-width:none;padding:0;margin:0;border-radius:0}
  #printRoot .slip .s-shop{font-size:22px}
  #printRoot .page-break{page-break-after:always;break-after:page}
  @page{size:auto;margin:7mm}
}

const seedRng = mulberry32(20261020);
const CUSTOMERS=[]; const TX_BY_CUST=new Map();
(function seed(){
  const N=5000;
  for(let i=0;i<N;i++){
    const fi=Math.floor(seedRng()*FIRST_F.length), si=Math.floor(seedRng()*SUR_F.length);
    const name=FIRST_F[fi]+' '+SUR_F[si];
    const phone='9'+String(Math.floor(seedRng()*900000000)+100000000);
    const id=1000+i;
    CUSTOMERS.push({id,name,phone,area:['गाँव-पश्चिम','मुख्य बाज़ार','स्टेशन रोड','नया मोहल्ला','पुराना बाज़ार'][Math.floor(seedRng()*5)],joined:TODAY.getTime()-Math.floor(seedRng()*700)*DAY});
  }
  // transactions
  for(const c of CUSTOMERS){
    const txs=[]; let active=seedRng();
    const nTx = active<0.12 ? 0 : Math.floor(seedRng()*13)+2; // ~12% dormant
    for(let k=0;k<nTx;k++){
      const back=Math.floor(seedRng()*200);
      const ts=TODAY.getTime()-back*DAY;
      const isDue = seedRng()<0.62;
      let amt,note,items=[];
      if(isDue){
        const nIt=1+Math.floor(seedRng()*3);
        for(let j=0;j<nIt;j++){ items.push({name:ITEMS[Math.floor(seedRng()*ITEMS.length)],qty:1+Math.floor(seedRng()*4),rate:RATES[Math.floor(seedRng()*RATES.length)]}); }
        amt=items.reduce((s,it)=>s+it.qty*it.rate,0);
        note=items.map(it=>it.name).join(', ');
      } else { amt=(Math.floor(seedRng()*10)+1)*50; note='नकद जमा'; }
      txs.push({id:c.id+'_'+k,date:ts,type:isDue?'due':'pay',amount:amt,note,items,_seed:1});
    }
    txs.sort((a,b)=>a.date-b.date);
    TX_BY_CUST.set(c.id,txs);
  }
})();

/* ---------- data access ---------- */
const ALL_CUSTOMERS=()=>CUSTOMERS.concat(S.addedCustomers);
function txsOf(id){ const a=(TX_BY_CUST.get(id)||[]).concat(S.addedTxs.filter(t=>t.custId===id)); return a.sort((x,y)=>x.date-y.date); }
function isVoid(t){ return !!t.void || !!(S.voided && S.voided[t.id]); }
function activeTxs(id){ return txsOf(id).filter(t=>!isVoid(t)); }

/* FIFO ageing: allocate payments against oldest dues; leftover payment = advance */
function ledgerInfo(id){
  const txs=activeTxs(id); const lots=[]; let totalDue=0,totalPay=0,advance=0;
  for(const t of txs){
    if(t.type==='due'){ lots.push({date:t.date,rem:t.amount}); totalDue+=t.amount; }
    else{ let p=t.amount; totalPay+=t.amount; while(p>0 && lots.length){ const l=lots[0]; const take=Math.min(p,l.rem); l.rem-=take; p-=take; if(l.rem<=0) lots.shift(); } if(p>0) advance+=p; }
  }
  const outstanding=lots.reduce((s,l)=>s+l.rem,0);
  const oldest=lots.length?lots[0].date:null;
  const ageDays=oldest!=null?daysSince(oldest):0;
  // buckets
  const b={'0-30':0,'31-60':0,'61-90':0,'90+':0};
  for(const l of lots){ const a=daysSince(l.date); if(a<=30)b['0-30']+=l.rem; else if(a<=60)b['31-60']+=l.rem; else if(a<=90)b['61-90']+=l.rem; else b['90+']+=l.rem; }
  const lastTx=txs.length?txs[txs.length-1].date:null;
  return {outstanding,advance,oldest,ageDays,lastTx,buckets:b,totalDue,totalPay,txs,allTxs:txsOf(id)};
}
let LEDGER_CACHE=null;
function ledgerAll(){ if(LEDGER_CACHE) return LEDGER_CACHE; const m=new Map(); for(const c of ALL_CUSTOMERS()) m.set(c.id,ledgerInfo(c.id)); LEDGER_CACHE=m; return m; }
function invalidate(){ LEDGER_CACHE=null; }
function custById(id){ return ALL_CUSTOMERS().find(c=>c.id===id); }

function fillTpl(tpl,c,info){
  return tpl.replace(/{name}/g,c.name).replace(/{amount}/g,INR(info.outstanding)).replace(/{days}/g,info.ageDays).replace(/{shop}/g,S.settings.shop).replace(/{phone}/g,c.phone);
}
function waPhone(p){ let d=String(p).replace(/\D/g,''); if(d.length===12&&d.startsWith('91')) d=d.slice(2); if(d.length===11&&d.startsWith('0')) d=d.slice(1); return d; }
function waLink(phone,text){ return 'https://wa.me/91'+waPhone(phone)+'?text='+encodeURIComponent(text); }
function catalogNames(){ return (S.catalog&&S.catalog.length)?S.catalog.map(x=>x.name):ITEMS; }

function inQuiet(){ const h=new Date().getHours(); const st=S.settings; const f=st.quietFrom==null?21:st.quietFrom, t=st.quietTo==null?8:st.quietTo; return f>t?(h>=f||h<t):(h>=f&&h<t); }
function runAutomation(){
  const st=S.settings; const L=ledgerAll(); const now=Date.now(); let msgs=0,calls=0,skipped=0;
  for(const c of ALL_CUSTOMERS()){
    const info=L.get(c.id); if(!info || info.outstanding<=0) continue;
    if(S.noRemind && S.noRemind[c.id]){ skipped++; continue; }
    const alreadyToday=S.log.some(l=>l.custId===c.id && daysSince(l.date)===0);
    if(alreadyToday) continue;
    if(st.autoMsg && info.ageDays>=st.remindDays){ S.log.push({id:'m'+now+'_'+c.id,custId:c.id,type:'msg',date:now,channel:'WhatsApp + SMS',body:fillTpl(st.msgTemplate,c,info),status:'भेजा गया'}); msgs++; }
    if(st.autoCall && info.ageDays>=st.callDays && !inQuiet()){ S.log.push({id:'c'+now+'_'+c.id,custId:c.id,type:'call',date:now,channel:'IVR कॉल',body:fillTpl(st.callScript,c,info),status:'कॉल की गई'}); calls++; }
  }
  save(); return {msgs,calls,skipped};
}

function matchCust(c,q){ const d=q.replace(/\D/g,''); return c.name.toLowerCase().includes(q) || (c.area||'').toLowerCase().includes(q) || c.phone.includes(q) || (d.length>=3 && c.phone.includes(d)); }
function filteredCustomers(){
  const L=ledgerAll(); const q=custQuery.trim().toLowerCase();
  let arr=ALL_CUSTOMERS().map(c=>({c,i:L.get(c.id)}));
  if(q) arr=arr.filter(({c})=>matchCust(c,q));
  if(custSort==='out') arr.sort((a,b)=>b.i.outstanding-a.i.outstanding);
  else if(custSort==='age') arr.sort((a,b)=>b.i.ageDays-a.i.ageDays);
  else arr.sort((a,b)=>a.c.name.localeCompare(b.c.name,'hi'));
  return arr;
}
function drawCustList(){
  const arr=filteredCustomers(); const pages=Math.max(1,Math.ceil(arr.length/PAGE));
  if(custPage>pages) custPage=pages;
  const slice=arr.slice((custPage-1)*PAGE,custPage*PAGE);
  const el=$('#custList');
  if(!arr.length){ el.innerHTML=`<div class="empty"><div class="big">कोई ग्राहक नहीं मिला</div>दूसरा नाम या नंबर आज़माएँ।</div>`; return; }
  el.innerHTML=`
  <div class="tbl-wrap"><div class="tbl-scroll">
  <table><thead><tr>

  </tr></thead><tbody>
  ${slice.map(({c,i})=>`<tr class="clickable" onclick="openCustomer(${c.id})">
    <td><div class="cust-name">${esc(c.name)}</div><div class="cust-sub mono">${c.phone}</div></td>
    <td><span class="tag">${esc(c.area||'—')}</span></td>
    <td class="r num">${INR(i.totalDue)}</td>
    <td class="r num">${INR(i.totalPay)}</td>
    <td class="r num ${i.outstanding>0?'amt-in':'amt-out'}">${i.outstanding>0?INR(i.outstanding):'—'}</td>
    <td class="r num">${i.outstanding>0?i.ageDays+' दिन':'—'}</td>
    <td>${i.outstanding<=0?'<span class="pill green">हिसाब साफ़</span>':i.ageDays>=S.settings.remindDays?'<span class="pill red">ओवरड्यू</span>':'<span class="pill amber">बाकी</span>'}</td>
  </tr>`).join('')}
  </tbody></table></div></div>
  <div class="pager">
    <div>कुल <b class="num">${arr.length.toLocaleString('en-IN')}</b> ग्राहक · पेज ${custPage}/${pages}</div>
    <div class="pages">
      <button onclick="custPage=Math.max(1,custPage-1);drawCustList()" ${custPage===1?'disabled':''}>‹</button>
      ${pageNums(custPage,pages).map(p=>p==='…'?'<button disabled>…</button>':`<button class="${p===custPage?'on':''}" onclick="custPage=${p};drawCustList()">${p}</button>`).join('')}
      <button onclick="custPage=Math.min(${pages},custPage+1);drawCustList()" ${custPage===pages?'disabled':''}>›</button>
    </div>
  </div>`;
}
function pageNums(cur,total){
  const out=[]; const add=n=>{if(!out.includes(n))out.push(n);};
  add(1); for(let i=cur-1;i<=cur+1;i++) if(i>1&&i<total) add(i); add(total);
  out.sort((a,b)=>a-b); const res=[]; for(let i=0;i<out.length;i++){ if(i&&out[i]-out[i-1]>1) res.push('…'); res.push(out[i]); } return res;
}

    r.innerHTML=hits.map(c=>`<button class="btn sm" style="margin:6px 6px 0 0" onclick="pickEntryCust(${c.id})">${esc(c.name)} <span class="mono" style="color:var(--dim)">${c.phone}</span></button>`).join('')||'<div class="note">कोई नहीं मिला</div>';
  });
  window.pickEntryCust=id=>{ const c=custById(id); sel=c; $('#eSearch').value=c.name+' · '+c.phone; $('#eResults').innerHTML=''; };
  window._getSel=()=>sel;
  window.setEType=t=>{ $$('#eType button').forEach(b=>b.classList.remove('on','due','pay')); $('#eType button[data-t="'+t+'"]').classList.add('on',t);
    $('#eDueBlock').style.display=t==='due'?'':'none'; $('#ePayBlock').style.display=t==='pay'?'':'none'; recalcTotal(); };
  window.itemRowHTML=(n,q,r)=>'<div class="item-row" style="display:grid;grid-template-columns:1fr 60px 84px 32px;gap:6px;margin-bottom:6px"><input class="i-name" list="itemList" placeholder="सामान" value="'+esc(n||'')+'"><input class="i-qty" type="number" min="1" value="'+(q||1)+'" placeholder="नग"><input class="i-rate" type="number" min="0" value="'+(r||'')+'" placeholder="भाव"><button class="btn sm ghost" onclick="this.parentNode.remove();recalcTotal()">✕</button></div>';
  window.addItemRow=(n,q,r)=>{ $('#eItems').insertAdjacentHTML('beforeend',itemRowHTML(n,q,r)); recalcTotal(); };
  window.recalcTotal=()=>{
    let total=0,count=0;
    $$('#eItems .item-row').forEach(row=>{ const q=parseFloat($('.i-qty',row).value)||0, r=parseFloat($('.i-rate',row).value)||0, nm=$('.i-name',row).value.trim(); if(nm&&q*r>0){total+=q*r;count++;} });
    const type=$('#eType button.on').dataset.t;
    const shown=type==='pay'?(parseFloat(($('#eAmt')||{}).value)||0):total;
    const lbl=type==='pay'?'भुगतान रकम':(count+' सामान');
    $('#eTotal').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--dim);font-size:13px">'+lbl+'</span><span class="num" style="font-family:var(--f-head);font-size:24px">'+INR(shown)+'</span></div>';
  };
  window.readItems=()=>$$('#eItems .item-row').map(row=>({name:$('.i-name',row).value.trim(),qty:parseFloat($('.i-qty',row).value)||1,rate:parseFloat($('.i-rate',row).value)||0})).filter(it=>it.name&&it.rate>0);
  window.saveEntry=()=>{
    const c=window._getSel(); const type=$('#eType button.on').dataset.t;
    if(!c){ $('#eErr').textContent='पहले ग्राहक चुनें।'; return; }
    let items=[], amt=0;
    if(type==='due'){ items=readItems(); amt=items.reduce((s,it)=>s+it.qty*it.rate,0); if(!amt){ $('#eErr').textContent='सामान की लाइन भरें (नाम, नग, भाव)।'; return; } }
    else{ amt=parseFloat($('#eAmt').value); if(!amt||amt<=0){ $('#eErr').textContent='सही रकम डालें।'; return; } }
    const dateVal=$('#eDate').value; const ts=dateVal?new Date(dateVal+'T12:00:00').getTime():Date.now();
    if(activeTxs(c.id).some(t=>t.type===type && t.amount===amt && daysSince(t.date)===daysSince(ts)) && !window.confirm('इसी ग्राहक की ऐसी ही एंट्री उसी दिन पहले से है। फिर भी जोड़ें?')) return;
    const tx={id:'u'+Date.now(),custId:c.id,date:ts,type,amount:amt,items:type==='due'?items:[],note:type==='due'?items.map(it=>it.name).join(', '):'नकद जमा'};
    S.addedTxs.push(tx); save(); invalidate();
    const i=ledgerInfo(c.id);
    $('#entryPreview').innerHTML='<div class="ledger-line"><div class="dt">'+fmtDate(ts)+'</div><div class="desc"><div class="n">'+esc(c.name)+'</div><div class="s">'+(type==='due'?'उधार दिया':'भुगतान मिला')+' · '+esc(tx.note)+'</div></div><div class="amt '+(type==='due'?'amt-in':'amt-out')+'">'+(type==='due'?'+':'−')+INR(amt)+'</div></div>'+
      '<div style="margin-top:14px;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)"><div style="font-size:13px;color:var(--dim)">'+esc(c.name)+' का नया बकाया</div><div class="num" style="font-family:var(--f-head);font-size:26px;color:'+(i.outstanding>0?'var(--red)':'var(--green)')+'">'+INR(i.outstanding)+'</div></div>'+
      '<button class="btn primary block" style="margin-top:12px" onclick="slipBill('+c.id+',\''+tx.id+'\')">इस बिल की स्लिप प्रिंट करें</button>'+
      '<button class="btn block" style="margin-top:8px" onclick="slipBalance('+c.id+')">बकाया पर्ची प्रिंट करें</button>';
    toast('दर्ज हो गया — स्लिप प्रिंट कर सकते हैं');
    $('#eItems').innerHTML=''; addItemRow(); $('#eAmt').value=''; $('#eErr').textContent='';
  };
  window.onItemInput=(e)=>{ const row=e.target.closest('.item-row'); if(row && e.target.classList.contains('i-name')){ const hit=(S.catalog||[]).find(x=>x.name===e.target.value.trim()); if(hit && !parseFloat($('.i-rate',row).value)) $('.i-rate',row).value=hit.rate; } recalcTotal(); };
  $('#eItems').addEventListener('input',onItemInput);
  $('#eAmt').addEventListener('input',recalcTotal);
  addItemRow(); recalcTotal();
}

/* ---- reports tab ---- */
function tabRep(){
  const L=ledgerAll(); let totalOut=0,totalDue=0,totalPay=0; const buckets={'0-30':0,'31-60':0,'61-90':0,'90+':0};
  const areaMap={};
  for(const c of ALL_CUSTOMERS()){ const i=L.get(c.id); if(!i)continue; totalOut+=i.outstanding; totalDue+=i.totalDue; totalPay+=i.totalPay; for(const k in buckets)buckets[k]+=i.buckets[k]; areaMap[c.area]=(areaMap[c.area]||0)+i.outstanding; }
  const maxB=Math.max(1,...Object.values(buckets));
  const maxArea=Math.max(1,...Object.values(areaMap));
  $('#tabBody').innerHTML=`
  <div class="panel">
  <div class="grid g-kpi" style="margin-bottom:18px">
    <div class="card kpi"><div class="k-lbl">कुल बिक्री (उधार+नकद)</div><div class="k-val num">${INR(totalDue+totalPay)}</div><div class="k-sub">सभी लेन-देन का जोड़</div></div>
    <div class="card kpi"><div class="k-lbl">कुल उधार दिया</div><div class="k-val num amt-in">${INR(totalDue)}</div><div class="k-sub">अब तक</div></div>
    <div class="card kpi"><div class="k-lbl">कुल वसूली</div><div class="k-val num amt-out">${INR(totalPay)}</div><div class="k-sub">अब तक मिला</div></div>
    <div class="card kpi hero"><div class="k-lbl">शुद्ध बकाया</div><div class="k-val num" style="color:var(--terra)">${INR(totalOut)}</div><div class="k-sub">वसूली बाकी</div></div>
  </div>
  <div class="grid g-2">
    <div class="card">
      <div class="sec-label"><span class="d"></span>बकाया विश्लेषण</div>
      <h3 style="margin-bottom:14px">बकाये की उम्र के हिसाब से</h3>
      ${Object.entries(buckets).map(([k,v])=>`<div class="age-row"><div><span class="tag">${k} दिन</span></div><div class="bar"><i style="width:${(v/maxB*100).toFixed(1)}%;background:${k==='90+'?'var(--red)':k==='61-90'?'var(--gold)':k==='31-60'?'var(--terra)':'var(--green)'}"></i></div><div class="num" style="text-align:right;font-weight:600">${INR(v)}</div></div>`).join('')}
    </div>
    <div class="card">
      <div class="sec-label"><span class="d"></span>क्षेत्र के हिसाब से</div>
      <h3 style="margin-bottom:14px">किस इलाक़े का बकाया ज़्यादा</h3>
      ${Object.entries(areaMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="age-row"><div><span class="tag">${esc(k)}</span></div><div class="bar"><i style="width:${(v/maxArea*100).toFixed(1)}%;background:var(--blue)"></i></div><div class="num" style="text-align:right;font-weight:600">${INR(v)}</div></div>`).join('')}
    </div>
  </div>
  </div>`;
}

function slipHeader(kind){

  return '<div class="s-shop">'+esc(st.shop)+'</div>'+'<div class="s-meta">'+esc(st.addr||'मुख्य बाज़ार')+(st.phone?' · '+esc(st.phone):'')+'</div>'+'<div class="s-kind">'+kind+'</div>';
}
function itemRows(t){
  if(t.items&&t.items.length) return t.items.map(it=>'<tr><td>'+esc(it.name)+'</td><td class="c">'+it.qty+'</td><td class="r">'+INR(it.rate)+'</td><td class="r">'+INR(it.qty*it.rate)+'</td></tr>').join('');
  return '<tr><td>'+esc(t.note||'सामान')+'</td><td class="c">1</td><td class="r">'+INR(t.amount)+'</td><td class="r">'+INR(t.amount)+'</td></tr>';
}
function balanceAt(id,txId){ let run=0; for(const t of activeTxs(id)){ run += t.type==='due'?t.amount:-t.amount; if(t.id===txId) return run; } return run; }
function slipBill(id,txId){
  const c=custById(id); const t=txsOf(id).find(x=>x.id===txId); if(!c||!t){ toast('बिल नहीं मिला'); return; }
  const bal=balanceAt(id,txId); const prev=bal-(t.type==='due'?t.amount:-t.amount);
  const pf=prev<0?('₹0 (जमा '+INR(-prev)+')'):INR(prev);
  const bf=bal<0?('₹0 (जमा '+INR(-bal)+')'):INR(bal);
  const html='<div class="slip">'+slipHeader('बिल / पक्का बिल')+
    '<div class="s-row"><span>ग्राहक</span><b>'+esc(c.name)+'</b></div>'+
    '<div class="s-row"><span>फ़ोन</span><span>'+c.phone+'</span></div>'+
    '<div class="s-row"><span>तारीख़</span><span>'+fmtDate(t.date)+'</span></div>'+
    '<hr><table><thead><tr><th>सामान</th><th class="c">नग</th><th class="r">भाव</th><th class="r">रकम</th></tr></thead><tbody>'+itemRows(t)+'</tbody></table><hr>'+
    '<div class="s-row b"><span>इस बिल का कुल</span><span>'+INR(t.amount)+'</span></div>'+
    '<div class="s-row"><span>पिछला बकाया</span><span>'+pf+'</span></div>'+
    '<div class="s-row b"><span>अब कुल बकाया</span><span>'+bf+'</span></div>'+
    '<div class="s-foot">यह राशि उधार बहीखाते में दर्ज है।<br>धन्यवाद — '+esc(S.settings.shop)+'</div></div>';
  openSlipPreview(html,'बिल स्लिप');
}
function slipBalance(id){
  const c=custById(id); if(!c){ toast('ग्राहक नहीं मिला'); return; }
  const i=ledgerInfo(id);
  const recent=i.txs.slice(-10).reverse();
  const rows=recent.map(t=>'<tr><td>'+fmtDate(t.date)+'</td><td>'+esc((t.note||'').slice(0,24))+'</td><td class="r">'+(t.type==='due'?INR(t.amount):'')+'</td><td class="r">'+(t.type==='pay'?INR(t.amount):'')+'</td></tr>').join('');
  const html='<div class="slip">'+slipHeader('उधार बकाया पर्ची')+
    '<div class="s-row"><span>ग्राहक</span><b>'+esc(c.name)+'</b></div>'+
    '<div class="s-row"><span>फ़ोन</span><span>'+c.phone+'</span></div>'+
    '<div class="s-row"><span>तारीख़</span><span>'+fmtDate(Date.now())+'</span></div>'+
    '<hr>'+
    '<div class="s-row"><span>कुल उधार लिया</span><span>'+INR(i.totalDue)+'</span></div>'+
    '<div class="s-row"><span>कुल जमा किया</span><span>'+INR(i.totalPay)+'</span></div>'+
    '<div class="s-row b" style="font-size:14px"><span>बकाया</span><span>'+INR(i.outstanding)+'</span></div>'+
    (i.outstanding>0?'<div class="s-row"><span>सबसे पुराना बकाया</span><span>'+i.ageDays+' दिन</span></div>':'')+
    '<hr><div style="font-weight:600;margin-bottom:4px">हाल के लेन-देन</div>'+
    '<table><thead><tr><th>तारीख़</th><th>विवरण</th><th class="r">उधार</th><th class="r">जमा</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4">कोई नहीं</td></tr>')+'</tbody></table>'+
    '<div class="s-foot">'+(i.outstanding>0?'कृपया बकाया राशि का भुगतान शीघ्र करें।':'हिसाब साफ़ है — धन्यवाद!')+'<br>'+esc(S.settings.shop)+'</div></div>';
  openSlipPreview(html,'बकाया पर्ची');
}
function txsOnDay(dayTs){
  const start=new Date(new Date(dayTs).setHours(0,0,0,0)).getTime(); const end=start+DAY; const out=[];
  for(const c of ALL_CUSTOMERS()){ const t=activeTxs(c.id).filter(x=>x.date>=start&&x.date<end); if(t.length) out.push({c,txs:t}); }
  out.sort((a,b)=>a.c.name.localeCompare(b.c.name,'hi'));
  return out;
}
let dayFilter='all', daySummaryOnly=false;
function daySummary(dayTs){
  let d=txsOnDay(dayTs);
  if(dayFilter!=='all') d=d.map(x=>({c:x.c,txs:x.txs.filter(t=>t.type===dayFilter)})).filter(x=>x.txs.length);
  let due=0,pay=0,n=0; for(const x of d) for(const t of x.txs){ if(t.type==='due')due+=t.amount; else pay+=t.amount; n++; }
  return {d,due,pay,n,cust:d.length};
}
function slipDay(dayTs){
  const s=daySummary(dayTs); let body='';
  if(!daySummaryOnly) for(const x of s.d){ const due=x.txs.filter(t=>t.type==='due'), pay=x.txs.filter(t=>t.type==='pay');
    const dueAmt=due.reduce((a,t)=>a+t.amount,0), payAmt=pay.reduce((a,t)=>a+t.amount,0);
    body+='<div class="cust-block"><div class="s-row b"><span>'+esc(x.c.name)+' <span style="font-weight:400">· '+x.c.phone+'</span></span><span>उधार '+INR(dueAmt)+' / जमा '+INR(payAmt)+'</span></div>';
    if(due.length) body+='<table><thead><tr><th>सामान</th><th class="c">नग</th><th class="r">भाव</th><th class="r">रकम</th></tr></thead><tbody>'+due.map(itemRows).join('')+'</tbody></table>';
    if(pay.length) body+='<div class="s-row"><span>नकद जमा</span><span>'+INR(payAmt)+'</span></div>';
    body+='</div>';
  }
  const html='<div class="slip wide">'+slipHeader('आज का हिसाब — '+fmtDate(dayTs))+
    '<div class="s-row"><span>कुल ग्राहक</span><b>'+s.cust+'</b></div>'+
    '<div class="s-row"><span>कुल लेन-देन</span><b>'+s.n+'</b></div>'+
    '<div class="s-row"><span>कुल उधार दिया</span><b>'+INR(s.due)+'</b></div>'+
    '<div class="s-row"><span>कुल नकद मिला</span><b>'+INR(s.pay)+'</b></div>'+
    '<hr>'+(body||'<div class="s-foot">आज कोई लेन-देन नहीं।</div>')+
    '<div class="s-foot">यह दिन का पूरा हिसाब है। — '+esc(S.settings.shop)+'</div></div>';
  openSlipPreview(html,'आज का हिसाब');
}
function slipDaySplit(dayTs){
  const s=daySummary(dayTs);
  if(!s.d.length){ toast('इस दिन कोई लेन-देन नहीं'); return; }
  const html=s.d.map((x,idx)=>{ const due=x.txs.filter(t=>t.type==='due'), pay=x.txs.filter(t=>t.type==='pay');
    const dueAmt=due.reduce((a,t)=>a+t.amount,0), payAmt=pay.reduce((a,t)=>a+t.amount,0);
    return '<div class="slip'+(idx<s.d.length-1?' page-break':'')+'">'+slipHeader('बिल — '+fmtDate(dayTs))+
      '<div class="s-row"><span>ग्राहक</span><b>'+esc(x.c.name)+'</b></div>'+
      '<div class="s-row"><span>फ़ोन</span><span>'+x.c.phone+'</span></div>'+
      '<hr><table><thead><tr><th>सामान</th><th class="c">नग</th><th class="r">भाव</th><th class="r">रकम</th></tr></thead><tbody>'+due.map(itemRows).join('')+'</tbody></table><hr>'+
      '<div class="s-row b"><span>उधार</span><span>'+INR(dueAmt)+'</span></div>'+
      (payAmt?'<div class="s-row"><span>नकद जमा</span><span>'+INR(payAmt)+'</span></div>':'')+
      '<div class="s-row b"><span>अब कुल बकाया</span><span>'+INR(Math.max(0,ledgerInfo(x.c.id).outstanding))+'</span></div>'+
      '<div class="s-foot">धन्यवाद — '+esc(S.settings.shop)+'</div></div>';
  }).join('');
  openSlipPreview(html,'हर ग्राहक की अलग स्लिप');
}
function openSlipPreview(html,title){
  $('#printRoot').innerHTML=html;
  $('#modalBox').innerHTML='<div class="slip-modal"><div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><b>'+esc(title)+' — प्रिंट पूर्वावलोकन</b><button class="btn sm ghost" onclick="closeModal()">बंद करें</button></div><div class="slip-scroll">'+html+'</div><div class="slip-actions"><button class="btn primary" onclick="window.print()">प्रिंट करें</button><button class="btn" onclick="closeModal()">रद्द करें</button><span style="color:var(--dim);font-size:12.5px;margin-left:auto">टिप: प्रिंट डायलॉग में “Save as PDF” चुनकर WhatsApp पर भी भेज सकते हैं</span></div></div>';
  $('#modal').classList.add('on');
}

function initBannerCarousel(){
  clearInterval(bnTimer);
  const tr=$('#bnTrack'); if(!tr || !tr.clientWidth) return;
  const dots=$('#bnDots'); const n=tr.children.length; if(n<2) return;
  const upd=()=>{ if(!dots) return; const i=Math.round(tr.scrollLeft/tr.clientWidth); [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i)); };
  tr.addEventListener('scroll',upd,{passive:true});
  bnTimer=setInterval(()=>{ try{ const i=Math.round(tr.scrollLeft/tr.clientWidth); const nx=(i+1)%n; tr.scrollTo({left:nx*tr.clientWidth,behavior:'smooth'}); }catch(e){} },4200);

let asstCtx=null, asstPlan=null, asstLogs=[], recog=null, recOn=false, asstVoiceOn=true;
const NUMW={एक:1,दो:2,तीन:3,चार:4,पांच:5,पाँच:5,छह:6,छे:6,सात:7,आठ:8,नौ:9,दस:10,ग्यारह:11,बारह:12,तेरह:13,चौदह:14,पंद्रह:15,सोलह:16,बीस:20,पच्चीस:25,तीस:30,चालीस:40,पचास:50,साठ:60,सत्तर:70,अस्सी:80,नब्बे:90,सौ:100,हजार:1000,हज़ार:1000};
function normalizeCmd(s){
  s=String(s||'').toLowerCase();
  s=s.replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d));
  s=s.replace(/[₹,]/g,' ').replace(/[।.,!?"'()\-]/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function convertNumberWords(s){
  const t=s.split(' '), out=[];
  for(let i=0;i<t.length;i++){
    const w=t[i]; let v=null;
    if(w==='साढ़े'||w==='साढे'){ const n=t[i+1]; if(n&&NUMW[n]!=null){ v=NUMW[n]+0.5; i++; } }
    else if(w==='सवा'){ const n=t[i+1]; if(n&&NUMW[n]!=null){ v=NUMW[n]+0.25; i++; } }
    else if(w==='डेढ़'||w==='डेढ'){ v=1.5; }
    else if(w==='ढाई'){ v=2.5; }
    else if(NUMW[w]!=null){ v=NUMW[w]; }
    if(v!=null && i+1<t.length && (t[i+1]==='सौ'||t[i+1]==='हजार'||t[i+1]==='हज़ार')){ v*=(t[i+1]==='सौ'?100:1000); i++; }
    out.push(v!=null?String(v):w);
  }
  return out.join(' ');
}
let CUST_INDEX=null;
function custIndex(){ if(CUST_INDEX) return CUST_INDEX; const m=new Map();
  for(const c of ALL_CUSTOMERS()){ for(const p of String(c.name).toLowerCase().split(/\s+/)){ if(p.length>=2){ if(!m.has(p)) m.set(p,[]); m.get(p).push(c); } } }
  CUST_INDEX=m; return m; }
function invalidateCustIndex(){ CUST_INDEX=null; }
function findCustomerIn(text){
  for(const r of (text.match(/\d{10,12}/g)||[])){ const ph=r.slice(-10); const hit=ALL_CUSTOMERS().find(c=>c.phone===ph); if(hit) return {c:hit,score:9}; }
  const allD=text.replace(/\D/g,'');
  if(allD.length>=10&&allD.length<=12){ const hit=ALL_CUSTOMERS().find(c=>c.phone===allD.slice(-10)); if(hit) return {c:hit,score:9}; }
  const idx=custIndex(); const sc=new Map();
  for(const t of text.split(/\s+/)){ if(t.length<2) continue; const list=idx.get(t); if(list) for(const c of list) sc.set(c.id,(sc.get(c.id)||0)+1); }
  const cands=[...sc.entries()].map(([id,n])=>({c:custById(id),n})).filter(x=>x.c);
  if(!cands.length) return null;
  for(const x of cands){ if(text.includes(String(x.c.name).toLowerCase())) x.n+=3; }
  cands.sort((a,b)=>b.n-a.n);
  const top=cands[0], ties=cands.filter(x=>x.n===top.n);
  return {c:top.c, score:top.n, ties:ties.length>1?ties.slice(0,6).map(x=>x.c):null};
}
function findItems(text){
  const out=[], used=[];
  for(const p of (S.catalog||[])){
    const key=String(p.name).toLowerCase().split(/\s+/)[0];
    if(key.length<2) continue;
    const idx=text.indexOf(key); if(idx<0) continue;
    if(used.some(u=>idx>=u.s && idx<u.e)) continue;
    let qty=1;
    const before=text.slice(Math.max(0,idx-16),idx);
    const m=before.match(/(\d+(?:\.\d+)?)\s*(किलो|किलोग्राम|kg|ग्राम|gram|लीटर|litre|लटर|नग|पैकेट|पीस|दर्जन|dozen)?\s*$/);
    if(m) qty=Number(m[1]);
    else{ const after=text.slice(idx+key.length, idx+key.length+18);
      const m2=after.match(/^\s*(?:का|की|के)?\s*(\d+(?:\.\d+)?)\s*(?:किलो|किलोग्राम|kg|ग्राम|gram|लीटर|litre|लटर|नग|पैकेट|पीस|दर्जन|dozen)?/);
      if(m2 && m2[1]) qty=Number(m2[1]); }
    out.push({name:p.name,rate:p.rate,qty,pid:p.id});
    used.push({s:idx,e:idx+key.length});
  }
  return out;
}
function parseCommand(raw){
  const text=convertNumberWords(normalizeCmd(raw));
  const has=(...ws)=>ws.some(w=>text.includes(w));
  let t2=text;
  for(const r of (text.match(/\d{10,12}/g)||[])){ if(ALL_CUSTOMERS().find(c=>c.phone===r.slice(-10))) t2=t2.replace(r,' '); }
  const nums=(t2.match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  const items=findItems(text);
  const itemQty=new Set(items.map(i=>i.qty));
  const isQ=/कितना|बताओ|हिसाब|रिपोर्ट|report/.test(text);
  const hasAct=/चढ़ा|चढा|डाल|जमा|लिख|भेज|भेजो|कर दो|करदो|प्रिंट|पर्ची|स्लिप|खोल/.test(text);
  let intent='';
  if(has('रिमाइंडर','याद दिला','मैसेज भेज','मैसेज कर','व्हाट्सएप','वाट्सएप','whatsapp','msg')) intent='remind';
  else if(has('स्लिप','पर्ची','प्रिंट','print')) intent='slip';
  else if(isQ && !hasAct) intent='query';
  else if(has('जमा','भुगतान','पेमेंट','चुका','चुकता','payment','pay')) intent='pay';
  else if(has('उधार','उधर','चढ़ा','चढा','डाल','लिख','due','udhaar','udhar')) intent='due';
  else if(has('खोलो','खोल','दिखाओ','open','ले चलो')) intent='open';
  else if(isQ) intent='query';
  const cust=findCustomerIn(text);
  let amount=null;
  const rest=nums.filter(n=>!itemQty.has(n) && n<10000000);
  if(rest.length) amount=Math.max(...rest);
  if(!amount && items.length) amount=items.reduce((s,i)=>s+i.qty*i.rate,0);
  return {text,intent,cust,amount,items,raw};
}

window.startVoice=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ asstStatus('इस ब्राउज़र में बोलकर सुनना उपलब्ध नहीं है — नीचे लिखकर बताएँ'); toast('इस ब्राउज़र में आवाज़ उपलब्ध नहीं — लिखकर बताएँ'); return; }
  if(recOn){ try{ recog.stop(); }catch(e){} return; }
  try{
    recog=new SR(); recog.lang='hi-IN'; recog.interimResults=true; recog.continuous=false; recog.maxAlternatives=3;
    recog.onstart=()=>{ recOn=true; asstMicUI(); };
    recog.onresult=e=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; const inp=$('#asrText'); if(inp) inp.value=txt.trim(); if(e.results[e.results.length-1].isFinal){ recOn=false; asstMicUI(); asstRun(txt); } };
    recog.onerror=ev=>{ recOn=false; asstMicUI(); asstStatus('आवाज़ नहीं सुन पाए ('+ev.error+') — लिखकर बताएँ'); };
    recog.onend=()=>{ recOn=false; asstMicUI(); };
    recog.start();
  }catch(e){ recOn=false; asstMicUI(); toast('माइक शुरू नहीं हो सका'); }
};

window.asstRun=(raw)=>{
  const text=String(raw||'').trim(); const msg=$('#asstMsg'); if(msg) msg.textContent='';
  if(!text){ if(msg) msg.textContent='कुछ बोलें या लिखें।'; return; }
  const p=parseCommand(text);
  if(!p.intent){ if(msg) msg.textContent='समझ नहीं पाया — जैसे कहें: “रमेश को 700 उधार चढ़ा दो”।'; asstLogAdd('•','समझ नहीं पाया: '+text,false); return; }
  if(p.intent==='query'){ asstQuery(p); return; }
  let cust=p.cust&&p.cust.c?p.cust.c:null;
  let ties=p.cust&&p.cust.ties?p.cust.ties:null;
  if(!cust && asstCtx) cust=custById(asstCtx);
  if(!cust){
    asstShowPicker('किस ग्राहक का? नाम बोलें या नीचे चुनें', ties||[]);
    asstLogAdd('?','ग्राहक साफ़ नहीं: '+text,false);
    asstPlan={text,intent:p.intent,amount:p.amount,items:p.items};
    return;
  }
  if(ties && ties.length>1 && !(p.cust.c && p.cust.score>=4)){
    asstShowPicker('कौन से '+esc(p.cust.c.name.split(' ')[0])+'? नीचे चुनें', ties);
    asstPlan={text,intent:p.intent,amount:p.amount,items:p.items};
    return;
  }
  asstShowPlan({text,intent:p.intent,cust,amount:p.amount,items:p.items});
};

function asstQuery(p){
  const L=ledgerAll(); const t=String(p.text||'');
  let ans='', say='';
  if(/कुल|सबका|पूरी दुकान|कितना उधार|कितना बकाया/.test(t)){
    let tot=0,od=0; for(const c of ALL_CUSTOMERS()){ const i=L.get(c.id); tot+=i.outstanding; if(i.outstanding>0&&i.ageDays>=S.settings.remindDays) od++; }
    ans='पूरी दुकान का बकाया <b>'+INR(tot)+'</b> है, और <b>'+od+'</b> ग्राहक ओवरड्यू हैं।'; say='कुल बकाया '+tot+' रुपये है।';
  } else if(/आज|today/.test(t)){
    const s=daySummary(Date.now()); ans='आज <b>'+s.cust+'</b> ग्राहक, उधार <b>'+INR(s.due)+'</b>, नकद <b>'+INR(s.pay)+'</b>।'; say='आज का उधार '+s.due+' और नकद '+s.pay+' रुपये।';
  } else if(p.cust&&p.cust.c){ const i=L.get(p.cust.c.id); ans=esc(p.cust.c.name)+' का बकाया <b>'+INR(i.outstanding)+'</b>'+(i.outstanding>0?' ('+i.ageDays+' दिन पुराना)':'')+(i.advance>0?' · अग्रिम '+INR(i.advance):'')+'।'; say='बकाया '+i.outstanding+' रुपये।'; }
  else { let tot=0; for(const c of ALL_CUSTOMERS()) tot+=L.get(c.id).outstanding; ans='पूरी दुकान का बकाया <b>'+INR(tot)+'</b> है।'; say='कुल बकाया '+tot+' रुपये।'; }

  asstLogAdd('i',t.replace(/<[^>]*>/g,'')); asstSpeak(say);
}

  if(deferredPrompt) h+='<button class="btn primary block" onclick="doInstall()">फ़ोन में इंस्टॉल करें</button>';
  else if(location.protocol.indexOf('http')!==0) h+='<div class="note" style="margin-bottom:10px">इंस्टॉल करने के लिए यह फ़ाइल किसी वेबसाइट (https) पर रखनी होगी। अभी यह फ़ाइल सीधे खुली है, इसलिए ब्राउज़र इंस्टॉल का बटन नहीं देता।</div>';
  h+='<details class="fold" style="margin-top:'+(h?'12px':'0')+'"><summary>ख़ुद कैसे इंस्टॉल करें?</summary><p>'+installSteps()+'</p></details>';
  el.innerHTML=h;
}
window.doInstall=async function(){
  if(!deferredPrompt){ toast('ब्राउज़र का इंस्टॉल बटन अभी उपलब्ध नहीं — नीचे के तरीके से करें'); return; }
  try{ deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; if(r&&r.outcome==='accepted'){ toast('इंस्टॉल हो रहा है…'); } deferredPrompt=null; renderInstallBox(); }catch(e){ toast('इंस्टॉल नहीं हो सका'); }
};

/* ---------- boot ---------- */
$('#shopNameTop').textContent=S.settings.shop;
renderInstallBox();
_labelObs.observe(document.body,{childList:true,subtree:true});
labelTables();
route();
</script>
</body>
</html>
